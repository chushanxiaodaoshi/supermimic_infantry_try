seed: 142
device: cuda:0
output: logs/infantry_flat_online_sync_smoke
cycles: 1

asset_config: configs/infantry/collection/isaaclab_flat.yaml
initial_world_model: results/world_model_shared_02/checkpoint_00070000.pt
# Supply with --actor; policy checkpoints are run artifacts and are not committed.
initial_actor: null

teacher_datasets:
  - name: flat_teacher
    path: data/teacher_isaaclab_flat_final_05
    weight: 1.0

replay:
  teacher_anchor_scale: 0.25
  recent_actor_cycles: 2
  actor_weight: 1.0
  actor_recency_decay: 0.7

student_collection:
  steps: 400
  max_episode_steps: 40
  chunk_steps: 64
  split_seed: 2026
  action_noise_std: 0.1
  action_noise_hold_steps: 10
  command_resample_steps: 500

world_model:
  hidden: [512, 512]
  # One differentiable primary plus two independent epistemic shadows.
  ensemble_size: 3
  termination_head: true
  termination_hidden: [128, 64]
  training:
    iterations: 10
    batch_size: 128
    window: 8
    learning_rate: 0.0001
    normalizer_samples: 2048
    max_grad_norm: 1.0
    termination_loss_weight: 1.0
    termination_positive_weight: 10.0
    checkpoint_every: 10
  validation:
    interval: 10
    split: 1
    horizons: [1, 4, 8, 16, 32]
    windows_per_source: 32
    constraint_samples: 16
    mjcf_path: mujoco390/mjcf/scene.xml

actor:
  base_config: configs/infantry/flat_policy_from_world_model.yaml
  iterations: 20
  batch_size: 256
  checkpoint_every: 20
  log_every: 5

evaluation:
  steps: 200
  vx: 1.0
  yaw: 0.0
  height: 0.2
